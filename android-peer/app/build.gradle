plugins { id 'com.android.application' }

android {
    namespace 'dev.personalcloud.android'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.personalcloud.android'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':peer-core') }
