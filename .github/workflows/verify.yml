name: PersonalCloud verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-node-and-peer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run scoped Java/Android peer tests
        run: ./scripts/test-all.sh
