name: PersonalCloud verification

on:
  push:
  pull_request:

jobs:
  java-node-and-peer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run scoped Java/Android peer tests
        run: ./scripts/test-all.sh
