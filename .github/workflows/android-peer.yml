name: Android peer build

on:
  push:
    paths:
      - 'android-peer/**'
      - 'scripts/build-android-apk.sh'
      - 'scripts/build-install-android-peer.sh'
      - 'scripts/setup-android-build-tools.sh'
      - 'scripts/test-android-app-integration.sh'
      - '.github/workflows/android-peer.yml'
  pull_request:
    paths:
      - 'android-peer/**'
      - 'scripts/build-android-apk.sh'
      - 'scripts/build-install-android-peer.sh'
      - 'scripts/setup-android-build-tools.sh'
      - 'scripts/test-android-app-integration.sh'
      - '.github/workflows/android-peer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` SDK package has been removed by Google.
          # Command-line tools are installed by this action; only platform-tools is needed here.
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Report toolchain versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
      - name: Assemble and validate Android debug APK
        run: ./scripts/build-android-apk.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: personalcloud-android-peer-debug
          path: android-peer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
