name: Linux FUSE adapter build

on:
  push:
    paths:
      - 'src/**'
      - 'integrations/linux/**'
      - 'build.sh'
      - '.github/workflows/linux-fuse.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'integrations/linux/**'
      - 'build.sh'
      - '.github/workflows/linux-fuse.yml'
  workflow_dispatch:

jobs:
  build-read-only-fuse-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install FUSE2 build headers and Maven
        run: |
          sudo apt-get update
          sudo apt-get install --yes maven libfuse-dev
      - name: Build core and FUSE adapter
        run: |
          ./build.sh
          ./integrations/linux/build-fuse.sh
      - name: Run Linux integration contract tests
        run: ./scripts/test-linux-integration.sh
